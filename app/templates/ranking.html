<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI Ranking - NFSe Analytics</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-content { padding: 30px; max-width: 1400px; margin: 0 auto; }
        .stat-card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); }
        .icon-box { width: 50px; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; }
        .bg-gradient-primary { background: linear-gradient(45deg, #4e73df, #224abe); }
        .bg-gradient-success { background: linear-gradient(45deg, #1cc88a, #13855c); }
        .bg-gradient-info { background: linear-gradient(45deg, #36b9cc, #258391); }
        .card-header { background-color: white; border-bottom: 1px solid #e3e6f0; }
        .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body>

    <div class="main-content">
        
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center">
                <a href="/dashboard" class="btn btn-outline-secondary me-3"><i class="fas fa-arrow-left"></i> Voltar</a>
                <div>
                    <h2 class="mb-0 text-gray-800">Ranking & BI</h2>
                    <small class="text-muted">Inteligência de Negócios NFS-e</small>
                </div>
            </div>
            <button class="btn btn-primary" onclick="loadData()"><i class="fas fa-sync-alt"></i> Atualizar</button>
        </div>

        <!-- KPIs -->
        <div class="row mb-4">
            <!-- Total Notas -->
            <div class="col-xl-4 col-md-6 mb-4">
                <div class="card stat-card h-100 py-2">
                    <div class="card-body">
                        <div class="row no-gutters align-items-center">
                            <div class="col mr-2">
                                <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">Total de Notas</div>
                                <div class="h5 mb-0 font-weight-bold text-gray-800" id="kpi-total-notes">...</div>
                            </div>
                            <div class="col-auto">
                                <div class="icon-box bg-gradient-primary"><i class="fas fa-file-invoice"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Valor Total -->
            <div class="col-xl-4 col-md-6 mb-4">
                <div class="card stat-card h-100 py-2">
                    <div class="card-body">
                        <div class="row no-gutters align-items-center">
                            <div class="col mr-2">
                                <div class="text-xs font-weight-bold text-success text-uppercase mb-1">Valor Total Transacionado</div>
                                <div class="h5 mb-0 font-weight-bold text-gray-800" id="kpi-total-value">...</div>
                            </div>
                            <div class="col-auto">
                                <div class="icon-box bg-gradient-success"><i class="fas fa-dollar-sign"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ticket Médio -->
            <div class="col-xl-4 col-md-6 mb-4">
                <div class="card stat-card h-100 py-2">
                    <div class="card-body">
                        <div class="row no-gutters align-items-center">
                            <div class="col mr-2">
                                <div class="text-xs font-weight-bold text-info text-uppercase mb-1">Ticket Médio</div>
                                <div class="h5 mb-0 font-weight-bold text-gray-800" id="kpi-avg-ticket">...</div>
                            </div>
                            <div class="col-auto">
                                <div class="icon-box bg-gradient-info"><i class="fas fa-chart-line"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row 1: Rankings -->
        <div class="row mb-4">
            <div class="col-lg-6">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">Top 10 Prestadores (Por Valor)</h6>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="providersChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">Top 10 Tomadores (Por Despesa)</h6>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="takersChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row 2: Timeline -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">Evolução Diária (Volume de Notas)</h6>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="timelineChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let providersChart = null;
        let takersChart = null;
        let timelineChart = null;

        // Formatter for Currency
        const formatCurrency = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        };

        async function loadData() {
            try {
                const response = await fetch('/api/stats/ranking');
                const data = await response.json();

                // Update KPIs
                document.getElementById('kpi-total-notes').innerText = data.kpis.total_notes.toLocaleString('pt-BR');
                document.getElementById('kpi-total-value').innerText = formatCurrency(data.kpis.total_value);
                document.getElementById('kpi-avg-ticket').innerText = formatCurrency(data.kpis.avg_ticket);

                // Render Charts
                renderProvidersChart(data.providers);
                renderTakersChart(data.takers);
                renderTimelineChart(data.timeline);

            } catch (error) {
                console.error("Erro ao carregar dados:", error);
                alert("Erro ao carregar dados do dashboard.");
            }
        }

        function renderProvidersChart(providers) {
            const ctx = document.getElementById('providersChart').getContext('2d');
            const labels = providers.map(p => p._id || 'Desconhecido');
            const values = providers.map(p => p.total_value);

            if (providersChart) providersChart.destroy();

            providersChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Valor Total (R$)',
                        data: values,
                        backgroundColor: '#4e73df',
                        borderRadius: 5
                    }]
                },
                options: {
                    indexAxis: 'y',
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function renderTakersChart(takers) {
            const ctx = document.getElementById('takersChart').getContext('2d');
            const labels = takers.map(t => t._id || 'Desconhecido');
            const values = takers.map(t => t.total_value);

            if (takersChart) takersChart.destroy();

            takersChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Despesa Total (R$)',
                        data: values,
                        backgroundColor: '#1cc88a',
                        borderRadius: 5
                    }]
                },
                options: {
                    indexAxis: 'y',
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function renderTimelineChart(timeline) {
            const ctx = document.getElementById('timelineChart').getContext('2d');
            const labels = timeline.map(t => t._id); // Date string
            const values = timeline.map(t => t.count);

            if (timelineChart) timelineChart.destroy();

            timelineChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Volume de Notas',
                        data: values,
                        borderColor: '#36b9cc',
                        backgroundColor: 'rgba(54, 185, 204, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        // Init
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
